name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Mutation testing runs nightly rather than on every push (see the job).
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (devcontainer)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Spec §17: CI runs inside the devcontainer image, so dev == CI bit-for-bit.
      - name: Build the devcontainer and run the full check
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: |
            set -euo pipefail
            corepack enable
            pnpm install --frozen-lockfile
            pnpm check
            # The §12.6 budget gate also runs inside `pnpm check` (vitest);
            # this prints the timeline and the blockers when it fails.
            pnpm balance:sim
            pnpm exec playwright install chromium
            pnpm e2e

  # Mutation testing is a separate job on purpose (spec §13, §17). A full run is
  # long — well over an hour on a four-core box — because a fifth of the mutants
  # are "static": their line also runs while a test module is being imported, so
  # Stryker cannot attribute them per test and replays the whole suite for each
  # one, and that suite now includes the fast-check properties. Left in the main
  # job it would hold the fast feedback — lint, types, tests, E2E — hostage to
  # it. It runs nightly (and on demand) rather than per change.
  #
  # If this starts timing out, the lever is the static mutants: most of them
  # come from test files computing their fixtures at module scope. Making those
  # lazy would cut the run substantially.
  mutation:
    name: stryker (core systems + curves + projection)
    # Nightly, and on demand: at over an hour a run, gating every change on it
    # cost more iteration than it caught. The 80 % break threshold still holds.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Build the devcontainer and run the mutation gate
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}/devcontainer
          cacheFrom: ghcr.io/${{ github.repository }}/devcontainer
          push: never
          runCmd: |
            set -euo pipefail
            corepack enable
            pnpm install --frozen-lockfile
            pnpm mutation
